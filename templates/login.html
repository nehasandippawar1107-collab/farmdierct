{% extends "base.html" %}

{% block title %}Sign In | FarmDirect{% endblock %}

{% block content %}
<div class="container auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">
        <i class="fa-solid fa-leaf"></i>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your FarmDirect customer, farmer, or admin account</p>
    </div>

    <!-- Quick Demo Accounts Box (Beginner & Testing Friendly) -->
    <div class="demo-account-box">
      <div class="demo-title">
        <i class="fa-solid fa-bolt" style="color: #d97706;"></i> 1-Click Test Credentials
      </div>
      <div class="demo-btn-group">
        <button type="button" class="demo-pill-btn" onclick="fillDemoAccount('customer')">
          <i class="fa-solid fa-user"></i> Customer (Priya)
        </button>
        <button type="button" class="demo-pill-btn" onclick="fillDemoAccount('farmer')">
          <i class="fa-solid fa-tractor"></i> Farmer (Ramesh)
        </button>
        <button type="button" class="demo-pill-btn" onclick="fillDemoAccount('farmer2')">
          <i class="fa-solid fa-apple-whole"></i> Farmer (Sunita)
        </button>
        <button type="button" class="demo-pill-btn" onclick="fillDemoAccount('admin')">
          <i class="fa-solid fa-shield-halved"></i> Admin
        </button>
      </div>
    </div>

    <!-- Login Form -->
    <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <input type="email" id="login-email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label class="form-label" for="login-password" style="margin: 0;">Password</label>
        </div>
        <input type="password" id="login-password" name="password" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.92rem; color: var(--text-muted);">
      Don't have an account yet? 
      <a href="{{ url_for('register') }}" style="font-weight: 700; color: var(--primary);">
        Create an Account
      </a>
    </div>
  </div>
</div>
{% endblock %}
